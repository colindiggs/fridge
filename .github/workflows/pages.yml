name: Build and deploy fridge page

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]   # the snapshot commit below must not retrigger a build
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"        # hourly, at an odd minute to dodge the top-of-hour queue

permissions:
  contents: write   # commit data/snapshot.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --quiet "google-auth>=2,<3" "requests>=2.32,<3"

      - name: Write service-account key to a temp file
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "::error::secret GCP_SA_KEY is not set"; exit 1; fi
          umask 077
          key="$RUNNER_TEMP/service-account.json"
          printf '%s' "$GCP_SA_KEY" > "$key"
          echo "GOOGLE_CREDENTIALS=$key" >> "$GITHUB_ENV"

      - name: Build page from the Sheet
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          OUT_DIR: _site
        run: python -I fridge.py --snapshot data/snapshot.json

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"

      - name: Guard against store numbers and street addresses
        run: bash .github/guard.sh _site data/snapshot.json

      - name: Commit data snapshot if it changed (keeps the schedule from going dormant)
        run: |
          git add -f data/snapshot.json
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update data snapshot"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
