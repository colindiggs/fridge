<title>The Fridge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=Kalam:wght@400;700&display=swap">
<style>
/* A kitchen wall: a stainless French-door fridge beside a pantry, receipt tape and a meal log below,
   then the data explorer, styled as a grocery aisle. */
:root {
  --wall: #e8ebe9; --tile: #dde2df;
  --steel-1: #e6e9eb; --steel-2: #c3c9cd; --steel-3: #9ba3a9;
  --inside: #f4fafb; --inside-glow: #ffffff; --glass: rgba(120,160,175,.35);
  --wood: #c48a58; --wood-dark: #9c6740; --shelf-wood: #e7c9a5;
  --ink: #1d2521; --ink-soft: #4b5a54; --muted: #75857f;
  --paper: #fbf8ef; --card: #ffffff; --line: #e1e5e2;
  --aisle: #1d4f3e; --shelf-edge: #c9ced1;
  --s-blue: #2a78d6; --s-yellow: #eda100; --s-magenta: #e87ba4; --s-green: #008300; --s-violet: #6250d6; --s-aqua: #1baf7a;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-hand: "Kalam", "Bradley Hand", "Segoe Print", cursive;
  --shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 18px 30px -18px rgba(30,50,45,.45);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --wall: #151a20; --tile: #1a2028;
  --steel-1: #c9cfd3; --steel-2: #9aa2a8; --steel-3: #6f787e;
  --inside: #fff7df; --inside-glow: #fffbef; --glass: rgba(170,140,90,.35);
  --wood: #7f5434; --wood-dark: #5f3c24; --shelf-wood: #b48a60;
  --ink: #e8eeec; --ink-soft: #b7c4c0; --muted: #8796a0;
  --paper: #232b35; --card: #1f262e; --line: #313a43;
  --aisle: #21664f; --shelf-edge: #3b444c;
  --s-blue: #3987e5; --s-yellow: #c98500; --s-magenta: #d55181; --s-green: #0ca30c; --s-violet: #9085e9; --s-aqua: #199e70;
  --shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 18px 34px -16px rgba(0,0,0,.7);
  color-scheme: dark;
}}
:root[data-theme="dark"] {
  --wall: #151a20; --tile: #1a2028;
  --steel-1: #c9cfd3; --steel-2: #9aa2a8; --steel-3: #6f787e;
  --inside: #fff7df; --inside-glow: #fffbef; --glass: rgba(170,140,90,.35);
  --wood: #7f5434; --wood-dark: #5f3c24; --shelf-wood: #b48a60;
  --ink: #e8eeec; --ink-soft: #b7c4c0; --muted: #8796a0;
  --paper: #232b35; --card: #1f262e; --line: #313a43;
  --aisle: #21664f; --shelf-edge: #3b444c;
  --s-blue: #3987e5; --s-yellow: #c98500; --s-magenta: #d55181; --s-green: #0ca30c; --s-violet: #9085e9; --s-aqua: #199e70;
  --shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 18px 34px -16px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font: 15px/1.45 var(--font-display);
  background-color: var(--wall);
  background-image: linear-gradient(var(--tile) 1px, transparent 1px), linear-gradient(90deg, var(--tile) 1px, transparent 1px);
  background-size: 44px 44px;
  overflow-x: hidden;
}
.wrap { max-width: 960px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
.synced { margin: 0; color: var(--muted); font: 12px var(--font-mono); }
.kitchen { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; overflow-x: clip; }
@media (max-width: 720px) { .kitchen { grid-template-columns: minmax(0, 1fr); gap: 34px; } }
button { font: inherit; color: inherit; }

/* Plain fridge (shown with ?flat, or when 3D can't run) */
.fridge { position: relative; background: linear-gradient(90deg, var(--steel-2), var(--steel-1) 45%, var(--steel-2)); border-radius: 12px; padding: 8px;
  box-shadow: var(--shadow); border: 1px solid var(--steel-3); }
.comp { position: relative; border-radius: 8px; perspective: 1400px; }
.comp + .comp { margin-top: 8px; }
.interior { background: radial-gradient(120% 70% at 50% 0%, var(--inside-glow), var(--inside)); border-radius: inherit;
  padding: 14px 12px 12px; box-shadow: inset 0 0 0 5px #d9dfe2, inset 0 10px 24px rgba(0,0,0,.12); }
.freezer .interior { aspect-ratio: 35 / 16; }
.main .interior { aspect-ratio: 35 / 55; }
.door { position: absolute; inset: 0; border-radius: inherit; border: 1px solid var(--steel-3); cursor: pointer; z-index: 2;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, rgba(0,0,0,.025) 1px 3px), linear-gradient(100deg, var(--steel-1), var(--steel-2) 70%, var(--steel-3));
  transform-origin: left center; transition: transform .7s cubic-bezier(.3,.7,.2,1), box-shadow .7s; box-shadow: 0 1px 0 rgba(255,255,255,.4) inset; }
.comp.open .door { transform: rotateY(-102deg); box-shadow: 12px 0 30px rgba(0,0,0,.25); }
.handle { position: absolute; right: 14px; top: 50%; width: 12px; height: 46%; max-height: 220px; translate: 0 -50%;
  border: 0; border-radius: 8px; background: linear-gradient(90deg, #8d969c, #f2f4f5 45%, #8d969c); box-shadow: 0 4px 8px rgba(0,0,0,.3); cursor: pointer; }
.freezer .handle { right: auto; left: 15%; top: 14px; translate: 0 0; width: 70%; height: 12px; background: linear-gradient(#f2f4f5, #8d969c); }
.handle:focus-visible, .item:focus-visible, .cab-door:focus-visible, .mag:focus-visible, .stag:focus-visible { outline: 3px solid var(--s-blue); outline-offset: 3px; }
.interior, .cab-inside { --muted: #66756f; --ink-soft: #34443e; color: #22302b; position: relative; }
.close { position: absolute; top: 8px; right: 10px; z-index: 1; border: 0; background: rgba(0,0,0,.07); color: #22302b; border-radius: 999px;
  font: 600 11px var(--font-mono); padding: 4px 10px; cursor: pointer; }

/* Magnets: paper and plastic things on the doors, sized in inches (--in is pixels per inch) so they stay true
   to the fridge. The 3D view and the plain view both pin each one to its spot from MAGS. */
.magnets { --in: 15px; position: absolute; inset: 0; pointer-events: none; }
.mag { position: absolute; pointer-events: auto; cursor: pointer; width: calc(var(--in) * var(--w)); border: 0; padding: 0; margin: 0; text-align: left;
  rotate: var(--r, 0deg); transform-origin: 0 0; background: none; display: block; color: #222; -webkit-tap-highlight-color: transparent;
  filter: drop-shadow(0 calc(var(--in) * .07) calc(var(--in) * .1) rgba(0,0,0,.28)) drop-shadow(0 calc(var(--in) * .2) calc(var(--in) * .3) rgba(0,0,0,.12)); }
.mag:hover { filter: drop-shadow(0 calc(var(--in) * .1) calc(var(--in) * .14) rgba(0,0,0,.3)) drop-shadow(0 calc(var(--in) * .35) calc(var(--in) * .45) rgba(0,0,0,.16)); }
.hand { font-family: var(--font-hand); font-weight: 400; letter-spacing: 0; }
.mag .paper { display: block; position: relative; }
/* a round dome magnet holding paper up */
.pin { position: absolute; z-index: 2; width: calc(var(--in) * .78); aspect-ratio: 1; border-radius: 50%; left: var(--px, 50%); top: calc(var(--in) * -.28); translate: -50% 0;
  background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.9), rgba(255,255,255,0) 34%), radial-gradient(circle at 62% 72%, rgba(0,0,0,.28), rgba(0,0,0,0) 62%), var(--pc, #c9463d);
  box-shadow: 0 1px 2px rgba(0,0,0,.4); }
/* notepad page: lined, a red margin, torn along the top */
.pad .paper { background: #fffdf5; color: #23366e; padding: calc(var(--in) * .55) calc(var(--in) * .4) calc(var(--in) * .45) calc(var(--in) * 1.05);
  -webkit-mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top/calc(var(--in) * .32) calc(var(--in) * .16) repeat-x, linear-gradient(#000 0 0) bottom/100% calc(100% - var(--in) * .16) no-repeat;
          mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top/calc(var(--in) * .32) calc(var(--in) * .16) repeat-x, linear-gradient(#000 0 0) bottom/100% calc(100% - var(--in) * .16) no-repeat; }
.pad .paper::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--in) * .78); width: 1px; background: #eba3a3; }
.pad .hd { display: block; font-size: max(11px, calc(var(--in) * .82)); line-height: 1.1; color: #b6362e; margin-bottom: calc(var(--in) * .1); }
.pad ul { list-style: none; margin: 0; padding: 0; font-size: max(10px, calc(var(--in) * .66)); line-height: 1.5; }
.pad li { border-bottom: 1px solid #c2d6e8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pad li.maybe { color: #7d8aa8; }
.pad li.done { text-decoration: line-through; text-decoration-thickness: 1.5px; color: #7d8aa8; }
/* index card */
.idx .paper { background: #fffefa repeating-linear-gradient(transparent 0 calc(var(--in) * .5 - 1px), #cfe0ee calc(var(--in) * .5 - 1px) calc(var(--in) * .5)) 0 calc(var(--in) * 1.25) / 100% calc(100% - var(--in) * 1.25) no-repeat;
  padding: calc(var(--in) * .32) calc(var(--in) * .4) calc(var(--in) * .4); color: #2a2a2a; }
.idx .paper::before { content: ""; position: absolute; left: 0; right: 0; top: calc(var(--in) * 1.18); height: 1.5px; background: #e59a9a; }
.idx .t { display: block; font-size: max(12px, calc(var(--in) * .95)); line-height: 1.15; height: calc(var(--in) * .9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.idx .s { display: block; margin-top: calc(var(--in) * .25); font-size: max(9.5px, calc(var(--in) * .58)); line-height: calc(var(--in) * .5); color: #444; }
/* sticky note */
.sticky .paper { background: linear-gradient(#efd665, #f7e27c 18%, #f9e68a); color: #2b2a1c; aspect-ratio: 1; padding: calc(var(--in) * .45) calc(var(--in) * .4); }
.sticky .paper::after { content: ""; position: absolute; right: 0; bottom: 0; width: 38%; height: 18%; background: linear-gradient(160deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.07)); }
.sticky .hd { display: block; font-size: max(11px, calc(var(--in) * .8)); line-height: 1; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.sticky ul { list-style: none; margin: calc(var(--in) * .2) 0 0; padding: 0; font-size: max(10px, calc(var(--in) * .62)); line-height: 1.32; }
.sticky li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sticky li::before { content: ""; display: inline-block; width: .62em; height: .62em; border: 1.3px solid currentColor; border-radius: 1px; margin-right: .35em; vertical-align: -.02em; rotate: -4deg; }
.sticky li.pencil { color: #6f6a4c; }
.sticky li.pencil::before { border-style: dotted; }
/* coupon, clipped along a dashed line */
.coupon .paper { background: #fbf4d8; color: #1f4d2e; padding: calc(var(--in) * .32) calc(var(--in) * .45); outline: 1.5px dashed #6b6a5d; outline-offset: calc(var(--in) * -.14); }
.coupon .v { display: block; font: 800 max(15px, calc(var(--in) * 1.25)) / 1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.coupon .s { display: block; font: 600 max(8.5px, calc(var(--in) * .45)) / 1.25 var(--font-display); margin-top: calc(var(--in) * .12); }
/* dry-erase board */
.wb .paper { background: linear-gradient(160deg, #ffffff, #f2f5f6); border: calc(var(--in) * .2) solid #d5dade; border-radius: calc(var(--in) * .14);
  padding: calc(var(--in) * .25) calc(var(--in) * .35) calc(var(--in) * .3); color: #1f3d8a; box-shadow: inset 0 0 0 1px #b9c0c5; }
.wb .s { display: block; font-size: max(9.5px, calc(var(--in) * .6)); line-height: 1.2; }
.wb .v { display: block; font: 700 max(17px, calc(var(--in) * 1.5)) / 1.05 var(--font-hand); }
.wb .d { display: block; font-size: max(9.5px, calc(var(--in) * .58)); color: #c23a2f; line-height: 1.2; }
.wb .d.ok { color: #1f7a3a; }
/* bottle cap */
.cap .paper { aspect-ratio: 1; border-radius: 50%; display: grid; place-content: center; text-align: center; color: #3b2a06;
  background: radial-gradient(circle, #f0c04a 0 55%, #d9a531 56% 60%, rgba(0,0,0,0) 61%), repeating-conic-gradient(#d6a12c 0 6deg, #a8770f 6deg 12deg); }
.cap .v { display: block; font: 800 max(11px, calc(var(--in) * .7)) / 1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cap .s { display: block; font-size: max(8.5px, calc(var(--in) * .42)); line-height: 1.1; margin-top: calc(var(--in) * .04); }
/* masking tape with handwriting */
.tape-strip { display: block; background: rgba(233,222,186,.92); padding: calc(var(--in) * .12) calc(var(--in) * .3); color: #2c2a24; font-size: max(10px, calc(var(--in) * .58)); line-height: 1.15; white-space: nowrap;
  clip-path: polygon(0 8%, 4% 0, 10% 6%, 18% 0, 30% 5%, 45% 0, 60% 6%, 75% 0, 88% 5%, 100% 0, 97% 50%, 100% 100%, 85% 94%, 70% 100%, 52% 95%, 35% 100%, 20% 94%, 8% 100%, 0 92%, 3% 50%); }
.flower svg { display: block; width: 100%; height: auto; }
.flower .tape-strip { margin: calc(var(--in) * -.25) calc(var(--in) * -.2) 0; rotate: -3deg; text-align: center; }
.tally .tape-strip { font-size: max(10px, calc(var(--in) * .6)); padding: calc(var(--in) * .16) calc(var(--in) * .35); }
.tally svg { display: inline-block; height: 1em; width: auto; vertical-align: -.15em; margin-left: .3em; }
/* receipt held by a binder clip */
.clip .bind { position: relative; display: block; width: 55%; margin: 0 auto calc(var(--in) * -.45); height: calc(var(--in) * .8); z-index: 2; }
.clip .bind::before { content: ""; position: absolute; inset: calc(var(--in) * .3) 0 0; background: linear-gradient(#3a7ad8, #2559a8); clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%); border-radius: 2px; }
.clip .bind::after { content: ""; position: absolute; left: 22%; right: 22%; top: 0; height: calc(var(--in) * .55); border: calc(var(--in) * .07) solid #b8bfc4; border-bottom: 0; border-radius: calc(var(--in) * .2) calc(var(--in) * .2) 0 0; }
.clip .paper { background: #fdfdfb; color: #2b2b2b; font: max(8.5px, calc(var(--in) * .46)) / 1.35 var(--font-mono); padding: calc(var(--in) * .6) calc(var(--in) * .3) calc(var(--in) * .5);
  -webkit-mask: linear-gradient(#000 0 0) top/100% calc(100% - var(--in) * .2) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/calc(var(--in) * .36) calc(var(--in) * .2) repeat-x;
          mask: linear-gradient(#000 0 0) top/100% calc(100% - var(--in) * .2) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/calc(var(--in) * .36) calc(var(--in) * .2) repeat-x; }
.clip .paper b { display: block; font-weight: 600; }
.clip .paper .tot { display: flex; justify-content: space-between; border-top: 1px dashed #888; margin-top: calc(var(--in) * .15); padding-top: calc(var(--in) * .1); font-weight: 600; }
.clip .paper .tot span:last-child { font-size: 1.25em; }
/* stamp card for the shopping streak */
.punch .paper { background: #fbf6ee; color: #3a2d22; padding: calc(var(--in) * .3) calc(var(--in) * .38) calc(var(--in) * .32); border-radius: calc(var(--in) * .1); }
.punch .hd { display: block; font-size: max(10px, calc(var(--in) * .62)); line-height: 1.1; }
.punch .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: calc(var(--in) * .1); margin-top: calc(var(--in) * .18); }
.punch .row i { aspect-ratio: 1; border-radius: 50%; border: 1px dashed #b7a993; }
.punch .row i.on { border: 0; background: radial-gradient(circle, rgba(0,0,0,0) 0 38%, #b53a31 40% 58%, rgba(0,0,0,0) 60%), radial-gradient(circle, #b53a31 0 22%, rgba(0,0,0,0) 24%); opacity: .85; rotate: var(--sr, 0deg); }
.pizza svg { display: block; width: 100%; height: auto; }
.mag .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* A magnet up close */
.magcard { position: absolute; z-index: 6; left: 50%; bottom: 14px; translate: -50% 0; width: min(330px, calc(100% - 24px)); background: #fffdf7; color: #1d2521;
  border-radius: 3px; box-shadow: 0 24px 50px -18px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.18); overflow: hidden; animation: pop .22s ease-out;
  --card: #fffdf7; --line: #e6e1d4; --ink: #1d2521; --ink-soft: #4b5a54; --muted: #75857f; }
@keyframes pop { from { opacity: 0; translate: -50% 12px; } }
.magcard header { padding: 12px 14px 6px; }
.magcard h3 { margin: 0; font: 400 20px/1.15 var(--font-hand); color: #23366e; padding-right: 48px; }
.magcard .v { font: 800 32px/1.05 var(--font-display); letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.magcard p { margin: 4px 0 0; font-size: 14px; color: #4b5a54; }
.magcard .body { padding: 0 14px 12px; }
.magcard .body .viz { margin-top: 4px; }
.magcard ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
.magcard ul.need { list-style: none; padding: 0; display: grid; gap: 6px; }
.magcard ul.need li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.magcard .row { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid #e6e1d4; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font: 600 13px var(--font-display); cursor: pointer; color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
.btn.sm { padding: 2px 10px; font-size: 12px; }
.magcard .x { position: absolute; top: 10px; right: 10px; border: 0; background: none; font: 600 12px var(--font-mono); color: #75857f; cursor: pointer; padding: 4px; }

/* Shelves and items (plain view) */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); grid-auto-rows: 66px; gap: 0 6px;
  background: repeating-linear-gradient(transparent 0 62px, var(--glass) 62px 66px); }
.item { position: relative; height: 58px; border: 0; padding: 9px 5px 0; border-radius: 9px 9px 5px 5px; text-align: left;
  font: 600 11px/1.12 var(--font-display); color: #22302b; background: var(--tub, #e8eef0); cursor: pointer; align-self: end;
  box-shadow: inset 0 5px 0 var(--lid, #9fb3bd), 0 3px 4px -2px rgba(0,0,0,.3); overflow: hidden; }
.item .n { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .bar { position: absolute; left: 5px; right: 5px; bottom: 5px; height: 4px; border-radius: 2px; background: rgba(0,0,0,.1); }
.item .bar i { display: block; height: 100%; border-radius: 2px; background: #3e9b5f; width: calc(var(--f) * 100%); }
.item.low .bar i { background: #e9ac2b; }
.item.ghost { background: transparent; color: var(--muted); box-shadow: none; outline: 1.5px dashed var(--muted); outline-offset: -2px; opacity: .8; }
.item.ghost .bar { display: none; }
.readout { min-height: 34px; margin: 8px 0 0; font: 12px/1.35 var(--font-mono); color: var(--ink-soft); }
.readout .btn { margin-left: 6px; padding: 2px 9px; font-size: 12px; }
.empty { font: 600 15px var(--font-display); color: var(--muted); padding: 10px 2px; }

/* Pantry */
.cabinet { position: relative; background: var(--wood-dark); border-radius: 8px; padding: 8px; box-shadow: var(--shadow); }
.cab-inside { position: relative; background: var(--shelf-wood); border-radius: 4px; padding: 12px 10px 10px; min-height: 420px; perspective: 1400px;
  box-shadow: inset 0 8px 18px rgba(0,0,0,.25); }
.cab-inside .shelf { background: repeating-linear-gradient(transparent 0 61px, var(--wood-dark) 61px 66px); }
.cab-doors { position: absolute; inset: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; pointer-events: none; perspective: 1400px; }
.cab-door { pointer-events: auto; border: 0; border-radius: 4px; cursor: pointer; background: var(--wood);
  box-shadow: inset 0 0 0 10px var(--wood), inset 0 0 0 12px var(--wood-dark), inset 0 0 0 999px rgba(255,255,255,.04);
  position: relative; transition: transform .7s cubic-bezier(.3,.7,.2,1); }

<script>
const D = /*__DATA__*/null;
window.FRIDGE_DATA = D;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dd = s => new Date(s + "T12:00:00");
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fmt = (s, o) => dd(s).toLocaleDateString("en-US", o || {month: "short", day: "numeric"});
const usd = n => "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const usd0 = n => "$" + Math.round(n).toLocaleString("en-US");
const usdk = n => n >= 1000 ? "$" + (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : usd0(n);
const plural = (n, [one, many]) => `${n.toLocaleString("en-US")} ${n === 1 ? one : many}`;
const short = m => { const t = m.split(/ with |,/)[0].replace(/^Sheet-pan /i, ""); return t[0].toUpperCase() + t.slice(1); };
const daysAgo = s => Math.round((dd(D.today) - dd(s)) / 864e5);
const ago = n => n < 14 ? `${n} days ago` : n < 60 ? `${Math.round(n / 7)} weeks ago` : `${Math.round(n / 30)} months ago`;
const cadence = n => !n ? "" : n <= 9 ? "about every week" : n <= 17 ? "about every 2 weeks" : n <= 25 ? "about every 3 weeks" : n <= 45 ? "about once a month" : `about every ${Math.round(n / 30)} months`;

// ---------- the ledger and its tallies ----------
// ledger.rows: [trip index, item, aisle, paid, qty, saved]; ledger.days: the trip dates.
const LED = D.ledger || { days: [], rows: [] }, DAYS = LED.days, ROWS = LED.rows;
const SINCE = DAYS.length ? fmt(DAYS[0], {month: "long", day: "numeric"}) : "";
const TALLIES = [
  { id: "groceries", name: "Groceries", c: "--s-blue", fg: "#fff", test: r => r[2] !== "Flowers" && r[2] !== "Household", trips: true },
  { id: "beer", name: "Beer", c: "--s-yellow", fg: "#231a00", test: r => r[1] === "Beer" || r[1] === "NA beer", unit: ["pack", "packs"] },
  { id: "flowers", name: "Flowers", c: "--s-magenta", fg: "#2a0d18", test: r => r[2] === "Flowers", unit: ["bunch", "bunches"] },
  { id: "saved", name: "Saved with deals", c: "--s-green", fg: "#fff", test: r => r[5] > 0, val: r => r[5], deals: true },
  { id: "coke", name: "Diet Coke", c: "--s-violet", fg: "#fff", test: r => r[1] === "Diet Coke", unit: ["12-pack", "12-packs"] },
  { id: "pizza", name: "Frozen pizza", c: "--s-aqua", fg: "#04261a", test: r => r[1] === "Frozen pizza", unit: ["pizza", "pizzas"] },
];
function tally(t) {
  const per = DAYS.map(d => ({ d, v: 0, n: 0, items: [] }));
  for (const r of ROWS) if (t.test(r)) {
    const p = per[r[0]]; p.v += t.val ? t.val(r) : r[3]; p.n += t.deals ? 1 : r[4]; p.items.push(r);
  }
  let cum = 0;
  per.forEach(p => { p.v = Math.round(p.v * 100) / 100; cum += p.v; p.cum = Math.round(cum * 100) / 100; });
  const hit = per.filter(p => p.v > 0);
  return { t, per, total: Math.round(cum * 100) / 100, trips: hit.length, count: per.reduce((a, p) => a + p.n, 0), last: hit.length ? hit[hit.length - 1].d : null };
}
const T = Object.fromEntries(TALLIES.map(t => [t.id, tally(t)]));
const tallyLine = x => {
  const t = x.t;
  if (t.trips) return `${plural(x.trips, ["trip", "trips"])}, ${usd(x.total / Math.max(1, x.trips))} a trip`;
  if (t.deals) return `across ${plural(x.count, ["item", "items"])}`;
  return `${plural(x.count, t.unit)} on ${x.trips} of ${DAYS.length} trips`;
};

// ---------- tooltips: anything with data-tip ----------
const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; document.body.append(tip);
let tipFor = null;
const placeTip = e => { tip.style.left = Math.max(110, Math.min(innerWidth - 110, e.clientX)) + "px"; tip.style.top = Math.max(60, e.clientY) + "px"; };
const tipEl = n => n && n.closest ? n.closest("[data-tip]") : null;
document.addEventListener("pointerover", e => { const el = tipEl(e.target); if (!el) return; tipFor = el; tip.innerHTML = el.dataset.tip; tip.hidden = false; placeTip(e); });
document.addEventListener("pointermove", e => { if (tipFor && tipEl(e.target) === tipFor) placeTip(e); });
document.addEventListener("pointerout", e => { if (tipFor && tipEl(e.relatedTarget) !== tipFor) { tip.hidden = true; tipFor = null; } });
addEventListener("scroll", () => { tip.hidden = true; tipFor = null; }, { passive: true });

// ---------- restock list: kept on this device, filled from the dotted "usually here" items ----------
const Restock = (() => {
  const KEY = "fridge.restock";
  let list = [];
  try { list = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} magnets(); };
  return {
    all: () => list.slice(), has: n => list.includes(n),
    toggle(n) { list = list.includes(n) ? list.filter(x => x !== n) : list.concat(n); save(); return list.includes(n); },
    clear() { list = []; save(); },
  };
})();
window.Restock = Restock;
function ghostNote(it) {
  const n = it.last ? daysAgo(it.last) : null;
  return `You usually have ${it.name.toLowerCase()}: bought on ${it.times || "?"} of ${it.trips || DAYS.length} trips${it.every ? `, ${cadence(it.every)}` : ""}.` +
    (n != null ? ` Last bought ${fmt(it.last)}, ${ago(n)}.` : "");
}
window.ghostNote = ghostNote;

// ---------- small SVG helpers ----------
const nice = m => { const s = Math.pow(10, Math.floor(Math.log10(m || 1))); return [1, 2, 2.5, 5, 10].map(k => k * s).find(k => m / k <= 4.5); };
const monthTicks = (t0, t1, X, y) => {
  let g = "";
  for (let m = new Date(t0.getFullYear(), t0.getMonth() + 1, 1); m <= t1; m.setMonth(m.getMonth() + 1))
    g += `<text x="${X(iso(m))}" y="${y}" text-anchor="middle">${m.toLocaleDateString("en-US", {month: "short"})}</text>`;
  return g;
};

// A running total: a step line from zero, a dot for each trip that added to it. Hover a trip for what it added.
function tallyChart(x, { W = 640, H = 200, small = false } = {}) {
  const color = `var(${x.t.c})`, L = small ? 36 : 46, R = small ? 8 : 56, Tp = 12, B = 22;
  const t0 = dd(DAYS[0]), t1 = dd(D.today), span = Math.max(1, t1 - t0);
  const X = s => L + (dd(s) - t0) / span * (W - L - R);
  const step = nice(Math.max(x.total, 1) * 1.08), top = Math.ceil(Math.max(x.total, 1) * 1.08 / step) * step;
  const Y = v => H - B - v / top * (H - B - Tp);
  let g = "";
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${usd0(v)}</text>`;
  g += monthTicks(t0, t1, X, H - 6);
  let d = `M${X(DAYS[0])},${Y(0)}`;
  for (const p of x.per) if (p.v > 0) d += `H${X(p.d)}V${Y(p.cum)}`;
  d += `H${X(D.today)}`;
  const hits = x.per.filter(p => p.v > 0);
  let cols = "";
  hits.forEach((p, i) => {
    const xx = X(p.d), a = i ? (X(hits[i - 1].d) + xx) / 2 : L, b = i < hits.length - 1 ? (xx + X(hits[i + 1].d)) / 2 : W - R;
    const top3 = p.items.slice().sort((m, n) => (x.t.val ? x.t.val(n) - x.t.val(m) : n[3] - m[3])).slice(0, 3).map(r => esc(r[1])).join(", ");
    const what = x.t.trips ? "" : x.t.deals ? `<br>${top3}` : `<br>${plural(p.n, x.t.unit)}: ${top3}`;
    const tipTxt = `<b>${fmt(p.d)}</b><br>+${usd(p.v)} this trip${what}<br>${usd(p.cum)} so far`;
    cols += `<g class="col" data-tip="${esc(tipTxt)}"><rect class="hit" x="${a}" y="${Tp}" width="${Math.max(1, b - a)}" height="${H - B - Tp}"/>` +
      `<line class="hair" x1="${xx}" x2="${xx}" y1="${Tp}" y2="${H - B}"/><circle class="dot" cx="${xx}" cy="${Y(p.cum)}" r="${small ? 3.5 : 4.5}" fill="${color}" stroke="var(--card)" stroke-width="2"/></g>`;
  });
  const end = small ? "" : `<text class="lbl" x="${X(D.today) + 6}" y="${Y(x.total) + 4}">${usd0(x.total)}</text>`;
  return `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(x.t.name)}: running total since ${SINCE}, now ${usd(x.total)}">
    ${g}<line class="base" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/>
    <path d="${d}V${Y(0)}Z" fill="${color}" fill-opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>${cols}${end}</svg>`;
}

// ---------- magnets ----------
// Each thing's spot on the real fridge, in inches: x across from the left door's outer edge (the doors meet at 17.5),
// y up from the fridge floor to its top edge (the freezer drawer is below 0), w its width, r its tilt.
// The handles run up the inner edges from about 13 to 43 inches, so nothing sits there.
const MAGS = {
  plan:      { x: 1.6,  y: 51.6, w: 7.4, r: -1.5 },
  rewind:    { x: 8.3,  y: 49.4, w: 5.9, r: 3.5 },
  need:      { x: 2.2,  y: 40.6, w: 4.9, r: 2 },
  saved:     { x: 8.0,  y: 38.6, w: 6.1, r: -3 },
  week:      { x: 21.0, y: 51.8, w: 6.6, r: 0 },
  beer:      { x: 28.7, y: 52.0, w: 2.7, r: 8 },
  flowers:   { x: 29.0, y: 48.2, w: 3.5, r: -6 },
  groceries: { x: 21.6, y: 46.0, w: 3.9, r: 2 },
  streak:    { x: 26.3, y: 42.0, w: 6.4, r: -1.5 },

    return { k: `${lc(t.name)} since ${fmt(DAYS[0])}`, v: usd(x.total), p: `${tallyLine(x)}.${say}`, body: tallyChart(x, { W: 300, H: 120, small: true }), more: id };
  }
  if (id === "plan") return { k: "this week", v: plural(D.plan.length, ["meal", "meals"]), body: `<ul>${D.plan.map(m => `<li>${esc(m.meal)}${m.status === "proposed" ? " (maybe)" : ""}</li>`).join("")}</ul>` };

function tape() {
  const w = D.spend.weeks, max = Math.max(...w.map(x => x.groceries), D.spend.avg, 1) * 1.1;
  const W = 320, H = 130, L = 30, B = 18, bw = (W - L) / w.length;
  const y = v => H - B - v / max * (H - B - 8);
  const ticks = [0, 50, 100, 150, 200].filter(t => t < max);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly grocery spend, last ${w.length} weeks">`;
  ticks.forEach(t => svg += `<text x="${L - 4}" y="${y(t) + 3}" text-anchor="end">${t}</text><line class="grid" x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/>`);
  w.forEach((x, i) => {
    const X = L + i * bw + 2, last = i === w.length - 1;
    svg += x.shopped ? `<rect class="bar${last ? " now" : ""}" x="${X}" y="${y(x.groceries)}" width="${bw - 4}" height="${y(0) - y(x.groceries)}" rx="2" data-tip="${esc(`<b>Week of ${fmt(x.week)}</b><br>${usd(x.groceries)}`)}"/>`

    if (dd(x.week).getDate() <= 7) svg += `<text x="${X}" y="${H - 4}">${fmt(x.week, {month: "short"})}</text>`;
  });
  svg += `<line class="avg" x1="${L}" x2="${W}" y1="${y(D.spend.avg)}" y2="${y(D.spend.avg)}"/><text x="${W}" y="${y(D.spend.avg) - 4}" text-anchor="end">avg ${usd0(D.spend.avg)}</text></svg>`;
  $("#tape").innerHTML = `<h2>Groceries per week</h2>${svg}
    <div class="row"><span>This year</span><span>${usd(D.spend.ytd)}</span></div>
    <div class="row"><span>Average shop week</span><span>${usd(D.spend.avg)}</span></div>
    <div class="row"><span>Best streak</span><span>${D.streak.best} weeks</span></div>`;
}

function aisleDirectory() {
  const t0 = dd(DAYS[0]), t1 = dd(D.today), months = [];
  for (let m = new Date(t0.getFullYear(), t0.getMonth(), 1); m <= t1; m.setMonth(m.getMonth() + 1)) months.push([m.getFullYear(), m.getMonth()]);
  const mi = s => { const d = dd(s); return months.findIndex(([y, m]) => y === d.getFullYear() && m === d.getMonth()); };
  const A = {};
  for (const r of ROWS) { const a = (A[r[2]] ||= { name: r[2], total: 0, m: months.map(() => 0) }); a.total += r[3]; a.m[mi(DAYS[r[0]])] += r[3]; }
  const list = Object.values(A).sort((a, b) => b.total - a.total), all = list.reduce((s, a) => s + a.total, 0);
  const top = Math.max(...list.flatMap(a => a.m));

function priceCheck() {
  const by = {};
  for (const r of ROWS) if (r[1] !== "Unclear item") (by[r[1]] ||= []).push(r);
  const opts = Object.entries(by).filter(([, rs]) => new Set(rs.map(r => r[0])).size >= 4).sort((a, b) => b[1].length - a[1].length).map(([n]) => n);
  if (!opts.length) { $("#price").textContent = "Not enough repeat buys yet."; return; }
  const sel = $("#pick");
  sel.innerHTML = opts.map(n => `<option>${esc(n)}</option>`).join("");
  sel.value = opts.includes("Almond milk") ? "Almond milk" : opts[0];
  const draw = () => {
    const name = sel.value, pts = by[name].map(r => ({ d: DAYS[r[0]], u: r[3] / r[4], r })).sort((a, b) => a.d < b.d ? -1 : 1);
    const W = 320, H = 150, L = 40, R = 12, Tp = 10, B = 22, t0 = dd(DAYS[0]), t1 = dd(D.today), span = Math.max(1, t1 - t0);
    const X = s => L + (dd(s) - t0) / span * (W - L - R);
    const mx = Math.max(...pts.map(p => p.u)) * 1.15, step = nice(mx), top = Math.ceil(mx / step) * step;
    const Y = v => H - B - v / top * (H - B - Tp);
    const avg = pts.reduce((s, p) => s + p.u, 0) / pts.length;
    const lo = pts.reduce((a, p) => p.u < a.u ? p : a), hi = pts.reduce((a, p) => p.u > a.u ? p : a);
    const note = (p, above) => { const x = Math.max(L + 18, Math.min(W - R - 18, X(p.d))); return `<text class="lbl" x="${x}" y="${Y(p.u) + (above ? -9 : 17)}" text-anchor="middle">${usd(p.u)}</text>`; };
    let g = "";
    for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${v < 10 ? "$" + v.toFixed(2).replace(/\.00$/, "") : usd0(v)}</text>`;
    g += monthTicks(t0, t1, X, H - 6);
    const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p.d)},${Y(p.u)}`).join("");
    const dots = pts.map(p => `<g class="col" data-tip="${esc(`<b>${fmt(p.d)}</b><br>${usd(p.u)}${p.r[4] > 1 ? ` each, ${p.r[4]} for ${usd(p.r[3])}` : ""}${p.r[5] ? `<br>${usd(p.r[5])} off` : ""}`)}">
      <circle class="hit" cx="${X(p.d)}" cy="${Y(p.u)}" r="12"/><circle class="dot" cx="${X(p.d)}" cy="${Y(p.u)}" r="4.5" fill="var(--s-blue)" stroke="var(--card)" stroke-width="2"/></g>`).join("");
    $("#price").innerHTML = `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(name)} price per unit over time">${g}
      <line class="base" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/><line x1="${L}" x2="${W - R}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--ink-soft)" stroke-dasharray="3 3"/>
      <text x="${W - R}" y="${Y(avg) + 14}" text-anchor="end">avg ${usd(avg)}</text>
      <path d="${line}" fill="none" stroke="var(--s-blue)" stroke-width="2" stroke-linejoin="round"/>${dots}${lo.u.toFixed(2) === hi.u.toFixed(2) ? note(hi, true) : note(hi, true) + note(lo, false)}</svg>`;
  };
  sel.onchange = draw; draw();
}

function staples() {
  const by = {};
  for (const r of ROWS) if (r[1] !== "Unclear item" && r[2] !== "Household") (by[r[1]] ||= new Set()).add(r[0]);
  const items = Object.entries(by).map(([n, d]) => ({ n, d: [...d].sort((a, b) => a - b) })).filter(x => x.d.length >= 3)
    .sort((a, b) => b.d.length - a.d.length || a.n.localeCompare(b.n)).slice(0, 12);
  $("#staples").innerHTML = items.map(it => {
    const k = it.d.length, gaps = it.d.slice(1).map((d, i) => (dd(DAYS[d]) - dd(DAYS[it.d[i]])) / 864e5).sort((a, b) => a - b);
    const tipTxt = `<b>${esc(it.n)}</b><br>${cadence(gaps[gaps.length >> 1]) || "now and then"}<br>last bought ${fmt(DAYS[it.d[k - 1]])}`;
    return `<div class="staple" data-tip="${esc(tipTxt)}"><span>${esc(it.n)}</span><span class="track"><i style="width:${(k / DAYS.length * 100).toFixed(1)}%"></i></span><span class="n">${k} of ${DAYS.length}</span></div>`;
  }).join("");
}

function findings() {
  const out = [], by = {};
  for (const r of ROWS) (by[r[1]] ||= []).push(r);
  const trips = n => new Set(by[n].map(r => r[0])).size;
  const freq = Object.keys(by).filter(n => !/Unclear|Beer/.test(n)).sort((a, b) => trips(b) - trips(a));
  if (freq[0]) out.push(`${freq[0]} came home on ${trips(freq[0])} of ${DAYS.length} trips${by.Beer && trips("Beer") > trips(freq[0]) ? `. Only beer showed up more, on ${trips("Beer")}` : ", more than anything else"}.`);
  const tot = DAYS.map(() => 0); ROWS.forEach(r => tot[r[0]] += r[3]);
  const bi = tot.indexOf(Math.max(...tot));
  if (bi >= 0) { const tops = ROWS.filter(r => r[0] === bi).sort((a, b) => b[3] - a[3]).slice(0, 2); out.push(`Biggest haul: ${fmt(DAYS[bi])}, ${usd(tot[bi])} of groceries. ${tops.map(r => `${r[1]} (${usd(r[3])})`).join(" and ")} led it.`); }
  const flat = Object.keys(by).filter(n => n !== "Unclear item" && trips(n) >= 4 && new Set(by[n].map(r => (r[3] / r[4]).toFixed(2))).size === 1).sort((a, b) => trips(b) - trips(a))[0];
  if (flat) out.push(`${flat} cost ${usd(by[flat][0][3] / by[flat][0][4])} all ${trips(flat)} times. The most loyal price in the store.`);
  const saved = ROWS.filter(r => r[5] > 0).sort((a, b) => b[5] - a[5]);
  if (saved.length) out.push(`Deals took ${usd(T.saved.total)} off, the biggest on ${saved[0][1].toLowerCase()} (${usd(saved[0][5])}).`);
  if (T.beer.total && T.flowers.total && T.groceries.total) out.push(`For every ${usd0(100)} of groceries, about ${usd0(T.beer.total / T.groceries.total * 100)} went to beer, and another ${usd0(T.flowers.total / T.groceries.total * 100)} to flowers on top.`);
  $("#findings").innerHTML = out.map(s => `<li>${esc(s)}</li>`).join("");
}
