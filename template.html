<title>The Fridge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a kitchen wall. Fridge (freezer over fridge) beside a pantry cabinet; receipt tape and a meal log pinned below. */
:root {
  --wall: #e6ecef; --tile: #d7dfe3; --floor: #b9c4c9;
  --enamel: #b9d9c8; --enamel-edge: #93bba6; --enamel-shade: #a5ccb8;
  --inside: #f4fafb; --inside-glow: #ffffff; --glass: rgba(120,160,175,.35);
  --wood: #c48a58; --wood-dark: #9c6740; --shelf-wood: #e7c9a5;
  --ink: #1d2b27; --ink-soft: #4f625b; --muted: #7d8f89;
  --paper: #fbf7ea; --sticky: #f7e27a; --card: #ffffff;
  --tomato: #e0533a; --mustard: #e9ac2b; --cobalt: #2d5fcf; --plum: #8a4fb3; --leaf: #3e9b5f;
  --chrome-1: #f4f6f7; --chrome-2: #a7b1b5;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 18px 30px -18px rgba(30,50,45,.45);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --wall: #151b27; --tile: #1b2331; --floor: #0f141d;
  --enamel: #6e9584; --enamel-edge: #557a69; --enamel-shade: #628a78;
  --inside: #fff7df; --inside-glow: #fffbef; --glass: rgba(170,140,90,.35);
  --wood: #7f5434; --wood-dark: #5f3c24; --shelf-wood: #b48a60;
  --ink: #e7eef0; --ink-soft: #b5c3c6; --muted: #8494a0;
  --paper: #232c3a; --sticky: #e6cf5d; --card: #2a3442;
  --chrome-1: #c8d0d4; --chrome-2: #6c7880;
  --shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 18px 34px -16px rgba(0,0,0,.7);
  color-scheme: dark;
}}
:root[data-theme="dark"] {
  --wall: #151b27; --tile: #1b2331; --floor: #0f141d;
  --enamel: #6e9584; --enamel-edge: #557a69; --enamel-shade: #628a78;
  --inside: #fff7df; --inside-glow: #fffbef; --glass: rgba(170,140,90,.35);
  --wood: #7f5434; --wood-dark: #5f3c24; --shelf-wood: #b48a60;
  --ink: #e7eef0; --ink-soft: #b5c3c6; --muted: #8494a0;
  --paper: #232c3a; --sticky: #e6cf5d; --card: #2a3442;
  --chrome-1: #c8d0d4; --chrome-2: #6c7880;
  --shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 18px 34px -16px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font: 15px/1.45 var(--font-display);
  background-color: var(--wall);
  background-image: linear-gradient(var(--tile) 1px, transparent 1px), linear-gradient(90deg, var(--tile) 1px, transparent 1px);
  background-size: 44px 44px;
  overflow-x: hidden;
}
.wrap { max-width: 920px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
.synced { margin: 0; color: var(--muted); font: 12px var(--font-mono); }
.kitchen { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; overflow-x: clip; }
@media (max-width: 720px) { .kitchen { grid-template-columns: minmax(0, 1fr); gap: 34px; } }
.label { font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 8px; }

/* Fridge body */
.fridge { position: relative; background: var(--enamel); border-radius: 26px 26px 14px 14px; padding: 10px;
  box-shadow: var(--shadow), inset -10px 0 0 var(--enamel-shade); border: 1px solid var(--enamel-edge); }
.fridge::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: -14px; height: 14px; background: var(--floor); border-radius: 0 0 8px 8px; z-index: -1; }
.comp { position: relative; border-radius: 18px 18px 10px 10px; perspective: 1400px; }
.comp + .comp { margin-top: 10px; border-radius: 10px 10px 12px 12px; }
.interior { background: radial-gradient(120% 70% at 50% 0%, var(--inside-glow), var(--inside)); border-radius: inherit;
  padding: 14px 12px 12px; box-shadow: inset 0 0 0 6px var(--enamel-shade), inset 0 10px 24px rgba(0,0,0,.12); }
.freezer .interior { min-height: 150px; }
.main .interior { min-height: 520px; }
.door { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(100deg, var(--enamel) 0 82%, var(--enamel-shade));
  border: 1px solid var(--enamel-edge); transform-origin: left center; transition: transform .7s cubic-bezier(.3,.7,.2,1), box-shadow .7s;
  cursor: pointer; box-shadow: 0 2px 0 rgba(255,255,255,.35) inset; z-index: 2; }
.comp.open .door { transform: rotateY(-102deg); box-shadow: 12px 0 30px rgba(0,0,0,.25); }
.handle { position: absolute; right: 14px; top: 50%; width: 16px; height: 46%; max-height: 210px; translate: 0 -50%;
  border: 0; border-radius: 10px; background: linear-gradient(90deg, var(--chrome-2), var(--chrome-1) 45%, var(--chrome-2));
  box-shadow: 0 4px 8px rgba(0,0,0,.25); cursor: pointer; }
.freezer .handle { height: 60%; }
.handle:focus-visible, .item:focus-visible, .cab-door:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 3px; }
.badge { position: absolute; left: 50%; bottom: 10px; translate: -50% 0; font: 600 10px var(--font-mono); letter-spacing: .3em; color: var(--enamel-edge); }

/* Magnets */
.magnets { position: absolute; inset: 18px 44px 30px 16px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: min-content; gap: 14px 12px; align-content: start; }
.mag { position: relative; color: #1d2b27; }
.mag::before { content: ""; position: absolute; top: -7px; left: 50%; width: 16px; height: 16px; translate: -50% 0; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.7), transparent 45%), var(--pin, var(--tomato)); box-shadow: 0 2px 3px rgba(0,0,0,.35); z-index: 1; }
.sticky { grid-column: 1 / -1; background: var(--sticky); padding: 14px 14px 12px; rotate: -1.2deg; box-shadow: 0 8px 14px -8px rgba(0,0,0,.4); --pin: var(--cobalt); }
.sticky h3 { font: 700 22px/1 var(--font-hand); margin: 0 0 6px; }
.sticky ul { margin: 0; padding: 0; list-style: none; font: 500 19px/1.15 var(--font-hand); display: grid; gap: 5px; }
.sticky li span { font: 600 10px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; opacity: .6; margin-right: 6px; }
.sticky li.maybe { opacity: .7; }
.streak { background: var(--tomato); color: #fff; border-radius: 50%; aspect-ratio: 1; max-width: 100%; display: grid; place-content: center; text-align: center;
  padding: 10px; box-shadow: 0 6px 10px -4px rgba(0,0,0,.4), inset 0 -6px 0 rgba(0,0,0,.12); rotate: 4deg; --pin: transparent; }
.streak::before { display: none; }
.streak b { font: 800 44px/0.9 var(--font-display); }
.streak small { font: 600 11px/1.2 var(--font-display); display: block; margin-top: 3px; }
.dots { display: flex; gap: 3px; justify-content: center; margin-top: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.35); }
.dots i.on { background: #fff; }
.ticket { background: #fffdf6; font-family: var(--font-mono); padding: 12px 10px 10px; rotate: -2deg; align-self: center;
  --pin: var(--mustard); box-shadow: 0 8px 12px -8px rgba(0,0,0,.45);
  -webkit-mask: radial-gradient(circle 5px at 0 50%, transparent 98%, #000) left/51% 100% no-repeat, radial-gradient(circle 5px at 100% 50%, transparent 98%, #000) right/51% 100% no-repeat;
          mask: radial-gradient(circle 5px at 0 50%, transparent 98%, #000) left/51% 100% no-repeat, radial-gradient(circle 5px at 100% 50%, transparent 98%, #000) right/51% 100% no-repeat; }
.ticket .k { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #6a6a62; }
.ticket .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ticket .delta { font-size: 11px; margin-top: 2px; }
.recipe { grid-column: 1 / -1; background: #ffffff; padding: 12px 14px 10px; rotate: .8deg; --pin: var(--leaf);
  background-image: linear-gradient(transparent 27px, #e25a4a 27px 28px, transparent 28px), repeating-linear-gradient(transparent 0 22px, #cfe0ef 22px 23px);
  background-position: 0 0, 0 6px; box-shadow: 0 8px 14px -8px rgba(0,0,0,.4); }
.recipe .k { font: 600 10px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: #8b5a52; height: 26px; }
.recipe .v { font: 700 23px/1.05 var(--font-hand); margin-top: 4px; }
.recipe .when { font: 11px var(--font-mono); color: #5f6c68; margin-top: 4px; }
.flower { display: flex; gap: 8px; align-items: center; background: transparent; --pin: transparent; color: #14241f; font-weight: 600; grid-column: 1 / -1; font-size: 12px; }
.flower::before { display: none; }
.flower svg { width: 34px; height: 34px; flex: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
.letters { position: absolute; left: 16px; top: 50%; translate: 0 -50%; display: flex; gap: 2px; }
.letters span { font: 800 30px/1 var(--font-display); color: var(--c); text-shadow: 0 2px 0 rgba(0,0,0,.25); display: inline-block; rotate: var(--r); }
.hint { position: absolute; right: 38px; bottom: 12px; font: 600 16px var(--font-hand); color: #2c443b; }
.interior, .cab-inside { --muted: #66756f; --ink-soft: #34443e; color: #22302b; position: relative; }
.close { position: absolute; top: 8px; right: 10px; z-index: 1; border: 0; background: rgba(0,0,0,.07); color: #22302b; border-radius: 999px;
  font: 600 11px var(--font-mono); padding: 4px 10px; cursor: pointer; }

/* Shelves and items */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); grid-auto-rows: 66px; gap: 0 6px;
  background: repeating-linear-gradient(transparent 0 62px, var(--glass) 62px 66px); }
.item { position: relative; height: 58px; border: 0; padding: 5px 5px 0; border-radius: 9px 9px 5px 5px; text-align: left;
  font: 600 11px/1.12 var(--font-display); color: #22302b; background: var(--tub, #e8eef0); cursor: pointer; align-self: end;
  box-shadow: inset 0 5px 0 var(--lid, #9fb3bd), 0 3px 4px -2px rgba(0,0,0,.3); padding-top: 9px; overflow: hidden; }
.item .n { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .bar { position: absolute; left: 5px; right: 5px; bottom: 5px; height: 4px; border-radius: 2px; background: rgba(0,0,0,.1); }
.item .bar i { display: block; height: 100%; border-radius: 2px; background: var(--leaf); width: calc(var(--f) * 100%); }
.item.low .bar i { background: var(--mustard); }
.item.ghost { background: transparent; color: var(--muted); box-shadow: none; outline: 1.5px dashed var(--muted); outline-offset: -2px; opacity: .75; }
.item.ghost .bar { display: none; }
.item.ghost::after { content: "usually"; position: absolute; left: 6px; bottom: 4px; font: 9px var(--font-mono); letter-spacing: .04em; }
.readout { min-height: 34px; margin: 8px 0 0; font: 12px/1.35 var(--font-mono); color: var(--ink-soft); }
.empty { font: 600 18px var(--font-hand); color: var(--muted); padding: 10px 2px; }
.inside-label { font: 600 10px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }

/* Pantry */
.cabinet { position: relative; background: var(--wood-dark); border-radius: 8px; padding: 8px; box-shadow: var(--shadow); }
.cab-inside { position: relative; background: var(--shelf-wood); border-radius: 4px; padding: 12px 10px 10px; min-height: 420px; perspective: 1400px;
  box-shadow: inset 0 8px 18px rgba(0,0,0,.25); }
.cab-inside .shelf { background: repeating-linear-gradient(transparent 0 61px, var(--wood-dark) 61px 66px); }
.cab-doors { position: absolute; inset: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; pointer-events: none; perspective: 1400px; }
.cab-door { pointer-events: auto; border: 0; border-radius: 4px; cursor: pointer; background:
  linear-gradient(var(--wood) 0 0) padding-box, var(--wood); box-shadow: inset 0 0 0 10px var(--wood), inset 0 0 0 12px var(--wood-dark), inset 0 0 0 999px rgba(255,255,255,.04);
  position: relative; transition: transform .7s cubic-bezier(.3,.7,.2,1); }
.cab-door::after { content: ""; position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(var(--chrome-1), var(--chrome-2)); translate: 0 -50%; box-shadow: 0 2px 3px rgba(0,0,0,.35); }
.cab-door.l { transform-origin: left center; } .cab-door.l::after { right: 18px; }
.cab-door.r { transform-origin: right center; } .cab-door.r::after { left: 18px; }
.cabinet.open .cab-door.l { transform: rotateY(-100deg); }
.cabinet.open .cab-door.r { transform: rotateY(100deg); }
.cab-sign { position: absolute; left: 50%; top: 22px; translate: -50% 0; z-index: 3; background: var(--paper); color: var(--ink); padding: 4px 10px; font: 700 18px var(--font-hand); rotate: -2deg; box-shadow: 0 4px 8px -4px rgba(0,0,0,.4); pointer-events: none; transition: opacity .3s; }
.cabinet.open .cab-sign { opacity: 0; }
.counter { margin-top: 14px; background: var(--paper); border-radius: 10px; padding: 12px 12px 10px; box-shadow: var(--shadow); }
.counter .shelf { background: none; }

/* Board below */
.board { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; margin-top: 44px; }
@media (max-width: 720px) { .board { grid-template-columns: minmax(0, 1fr); } }
.tape { background: var(--paper); padding: 16px 16px 20px; font-family: var(--font-mono); box-shadow: var(--shadow);
  -webkit-mask: linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/12px 8px repeat-x;
          mask: linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/12px 8px repeat-x; }
.tape h2, .log h2 { font: 800 18px var(--font-display); margin: 0 0 2px; }
.tape .row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; font-variant-numeric: tabular-nums; border-top: 1px dashed var(--muted); padding-top: 8px; margin-top: 8px; }
.chart { width: 100%; height: auto; display: block; margin-top: 10px; }
.chart text { font: 10px var(--font-mono); fill: var(--muted); }
.chart .avg { stroke: var(--tomato); stroke-dasharray: 3 3; }
.chart .bar { fill: var(--cobalt); } .chart .bar.now { fill: var(--leaf); } .chart .miss { fill: var(--muted); opacity: .35; }
.log { background: var(--card); padding: 16px; border-radius: 4px; box-shadow: var(--shadow); }
.log ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
.log li { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.log time { font: 12px var(--font-mono); color: var(--muted); padding-top: 2px; }
footer { margin-top: 28px; font: 11px var(--font-mono); color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .door, .cab-door { transition: none; } }
</style>
<!--BODY-->
<div class="wrap">
  <header class="top">
    <h1>The Fridge</h1>
    <p class="synced" id="synced"></p>
  </header>
  <main class="kitchen">
    <section aria-label="Fridge">
      <div class="fridge">
        <div class="comp freezer" id="freezer">
          <div class="interior" inert>
            <p class="inside-label">Freezer</p>
            <div class="shelf" data-loc="freezer"></div>
            <p class="readout" aria-live="polite"></p>
          </div>
          <div class="door" data-for="freezer">
            <div class="letters" id="letters" aria-hidden="true"></div>
            <button class="handle" aria-label="Open the freezer" aria-expanded="false"></button>
          </div>
        </div>
        <div class="comp main" id="fridgemain">
          <div class="interior" inert>
            <p class="inside-label">Fridge</p>
            <div class="shelf" data-loc="fridge"></div>
            <p class="readout" aria-live="polite"></p>
          </div>
          <div class="door" data-for="fridgemain">
            <div class="magnets" id="magnets"></div>
            <span class="hint" aria-hidden="true">pull to open</span>
            <button class="handle" aria-label="Open the fridge" aria-expanded="false"></button>
          </div>
        </div>
      </div>
    </section>
    <section aria-label="Pantry">
      <div class="cabinet" id="pantry">
        <div class="cab-inside">
          <div class="inside" inert>
            <p class="inside-label">Pantry</p>
            <div class="shelf" data-loc="pantry"></div>
            <p class="readout" aria-live="polite"></p>
          </div>
          <div class="cab-sign" aria-hidden="true">pantry</div>
        </div>
        <div class="cab-doors">
          <button class="cab-door l" aria-label="Open the pantry" aria-expanded="false"></button>
          <button class="cab-door r" aria-label="Open the pantry" aria-expanded="false"></button>
        </div>
      </div>
      <div class="counter">
        <p class="label">On the counter</p>
        <div class="shelf" data-loc="counter"></div>
        <p class="readout" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <section class="board">
    <div class="tape" id="tape"></div>
    <div class="log" id="log"></div>
  </section>
  <footer id="foot"></footer>
</div>
<script>
const D = /*__DATA__*/null;
window.FRIDGE_DATA = D;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dd = s => new Date(s + "T12:00:00");
const fmt = (s, o) => dd(s).toLocaleDateString("en-US", o || {month: "short", day: "numeric"});
const usd = n => "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const short = m => { const t = m.split(/ with |,/)[0].replace(/^Sheet-pan /i, ""); return t[0].toUpperCase() + t.slice(1); };

// Containers: a tub color and lid color per item, picked from its name.
const TUBS = [["#f3d6c9","#e0533a"],["#d6e4f7","#2d5fcf"],["#f6e7b7","#e9ac2b"],["#dcefdc","#3e9b5f"],["#eadcf2","#8a4fb3"],["#e9ecef","#7d8f89"]];
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);

function shelf(loc) {
  const el = document.querySelector(`.shelf[data-loc="${loc}"]`);
  const items = D.shelves[loc] || [];
  if (!items.length) { el.outerHTML = `<p class="empty">Nothing here yet.</p>`; return; }
  el.innerHTML = items.map((it, i) => {
    const [tub, lid] = TUBS[hash(it.name) % TUBS.length];
    const cls = it.ghost ? "ghost" : it.status;
    return `<button class="item ${cls}" data-i="${i}" style="--tub:${tub};--lid:${lid};--f:${it.fresh}"><span class="n">${esc(it.name)}</span><span class="bar"><i></i></span></button>`;
  }).join("");
  const out = el.parentElement.querySelector(".readout");
  el.addEventListener("click", e => {
    const b = e.target.closest(".item"); if (!b) return;
    const it = items[+b.dataset.i];
    const how = it.source === "receipt" ? "bought" : it.source === "photo" ? "seen in photo" : "noted";
    out.textContent = it.ghost
      ? `${it.name}: not here now. Usually is (${it.usual}). Last ${how} ${fmt(it.since)}.`
      : `${it.name}: ${how} ${fmt(it.since)}${it.status === "low" ? ", probably running low" : ""}. On ${it.usual}.`;
  });
  out.textContent = loc === "counter" ? "" : "Tap anything. Dashed ones are usually here but aren't now.";
}

function hinge(comp, btns) {
  const open = !comp.classList.contains("open");
  comp.classList.toggle("open", open);
  comp.querySelectorAll(".interior, .inside").forEach(n => n.inert = !open);
  btns.forEach(b => { b.setAttribute("aria-expanded", open); b.setAttribute("aria-label", b.getAttribute("aria-label").replace(open ? "Open" : "Close", open ? "Close" : "Open")); });
}

function magnets() {
  const p = D.plan.map(m => `<li class="${m.status === "proposed" ? "maybe" : ""}"><span>${m.slot === "batch main" ? "prep" : "dinner"}</span>${esc(short(m.meal))}${m.status === "proposed" ? "?" : ""}</li>`).join("");
  const st = D.streak, sp = D.spend;
  const pct = sp.avg ? Math.round((sp.this_week - sp.avg) / sp.avg * 100) : 0;
  const streakNote = st.shopped_this_week ? (st.current === 1 ? "week shopped" : "weeks in a row") : `in a row. Shop this week for ${st.current + 1}`;
  const r = D.rewind;
  $("#magnets").innerHTML = `
    <div class="mag sticky"><h3>This week</h3><ul>${p || "<li>Nothing planned yet</li>"}</ul></div>
    <div class="mag streak" title="Best run: ${st.best} weeks"><b>${st.current}</b><small>${streakNote}</small>
      <div class="dots">${st.recent.map(x => `<i class="${x ? "on" : ""}"></i>`).join("")}</div></div>
    <div class="mag ticket"><div class="k">This week</div><div class="v">${usd(sp.this_week)}</div>
      <div class="delta">avg ${usd(sp.avg)}${sp.this_week ? ` · ${pct >= 0 ? "+" : ""}${pct}%` : ""}</div></div>
    ${r ? `<div class="mag recipe"><div class="k">Haven't made in a while</div><div class="v">${esc(r.meal)}</div>
      <div class="when">last ${fmt(r.last)} · ${r.weeks_ago} weeks ago</div></div>` : ""}
    <div class="mag flower"><svg viewBox="0 0 40 40" aria-hidden="true">${[0,72,144,216,288].map(a => `<ellipse cx="20" cy="10" rx="6" ry="9" fill="#f08aa6" transform="rotate(${a} 20 20)"/>`).join("")}<circle cx="20" cy="20" r="6" fill="#e9ac2b"/></svg>
      <span>${usd(D.spend.flowers_ytd)} on flowers this year</span></div>`;
}

function letters() {
  const wd = dd(D.today).getDay();
  const word = wd === 0 ? "SHOP DAY" : ["SUN","MON","TUES","WED","THURS","FRI","SAT"][wd];
  const cols = ["var(--tomato)","var(--cobalt)","var(--mustard)","var(--leaf)","var(--plum)"];
  $("#letters").innerHTML = [...word].map((c, i) => c === " " ? `<span style="width:10px"></span>` :
    `<span style="--c:${cols[i % cols.length]};--r:${((i * 37) % 13) - 6}deg">${c}</span>`).join("");
}

function tape() {
  const w = D.spend.weeks, max = Math.max(...w.map(x => x.groceries), D.spend.avg, 1) * 1.1;
  const W = 320, H = 130, L = 30, B = 18, bw = (W - L) / w.length;
  const y = v => H - B - v / max * (H - B - 8);
  const ticks = [0, 50, 100, 150, 200].filter(t => t < max);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly grocery spend, last ${w.length} weeks">`;
  ticks.forEach(t => svg += `<text x="${L - 4}" y="${y(t) + 3}" text-anchor="end">${t}</text><line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--muted)" stroke-opacity=".2"/>`);
  w.forEach((x, i) => {
    const X = L + i * bw + 2, last = i === w.length - 1;
    svg += x.shopped ? `<rect class="bar${last ? " now" : ""}" x="${X}" y="${y(x.groceries)}" width="${bw - 4}" height="${y(0) - y(x.groceries)}" rx="2"><title>${fmt(x.week)}: ${usd(x.groceries)}</title></rect>`
                     : `<rect class="miss" x="${X}" y="${y(0) - 2}" width="${bw - 4}" height="2"/>`;
    if (dd(x.week).getDate() <= 7) svg += `<text x="${X}" y="${H - 4}">${fmt(x.week, {month: "short"})}</text>`;
  });
  svg += `<line class="avg" x1="${L}" x2="${W}" y1="${y(D.spend.avg)}" y2="${y(D.spend.avg)}"/></svg>`;
  $("#tape").innerHTML = `<h2>Receipt tape</h2><p class="label">Groceries per week, dashed line is your average</p>${svg}
    <div class="row"><span>This year</span><span>${usd(D.spend.ytd)}</span></div>
    <div class="row"><span>Average shop week</span><span>${usd(D.spend.avg)}</span></div>
    <div class="row"><span>Best streak</span><span>${D.streak.best} weeks</span></div>`;
}

function log() {
  $("#log").innerHTML = `<h2>Lately</h2><p class="label">What actually got cooked</p><ol>${D.eaten.map(m =>
    `<li><time datetime="${m.date}">${fmt(m.date)}</time><span>${esc(m.meal)}</span></li>`).join("")}</ol>`;
}

$("#synced").textContent = "Synced " + new Date(D.generated).toLocaleString("en-US", {weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
$("#foot").textContent = "From the Meal Prep Data sheet. Fridge contents are estimated from receipts until a Sunday photo says otherwise.";
magnets(); letters(); ["freezer", "fridge", "pantry", "counter"].forEach(shelf); tape(); log();

cbs.forEach(b => b.addEventListener("click", () => hinge(cab, cbs)));
